# application.yml — 所有服务共享配置（Spring Cloud Config 客户端启动时总是拉取）
# 注意：{name}-{profile}.yml 的优先级高于本文件，各服务不要重复覆盖

unimall:
  jwt:
    # 生产务必用环境变量 JWT_SECRET 注入（openssl rand -base64 48 生成），禁止提交真实密钥
    secret: ${JWT_SECRET:unimall-dev-placeholder-secret-key-please-change-in-production-0123456789}
    # JWT 有效期（7 天，兜底）；实际会话活跃度由 session-seconds 滑动控制
    expire-seconds: 604800
    # 会话滑动超时：30 分钟无操作则 Redis 白名单 key 过期，需重新登录
    session-seconds: 1800

# Bus 配置动态刷新（RabbitMQ，虚拟机 Docker）
spring:
  rabbitmq:
    host: 192.168.89.101
    port: 5672
    username: user
    password: 123456

# Actuator：暴露刷新端点（busrefresh 广播 / refresh 单服务）
management:
  endpoints:
    web:
      exposure:
        include: busrefresh,refresh,health
